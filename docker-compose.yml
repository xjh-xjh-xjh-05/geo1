version: '3.8'

# 网络配置
networks:
  geo-fake-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# 卷配置
volumes:
  postgres_data:
  redis_data:
  logs:
  models:

# 服务配置
services:
  # API服务
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geo-fake-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/geo_fake_detection
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DEBUG=${DEBUG:-false}
      - APP_NAME=GEO虚假内容检测平台
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      - db
      - redis
    volumes:
      - ./logs:/app/logs
      - models:/app/data/models
    networks:
      - geo-fake-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "2G"

  # 数据库服务
  db:
    image: postgres:15.6-alpine
    container_name: geo-fake-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=geo_fake_detection
      - POSTGRES_INITDB_ARGS=--encoding=UTF8
      - POSTGRES_HOST_AUTH_METHOD=md5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - geo-fake-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"

  # Redis缓存服务
  redis:
    image: redis:7.2-alpine
    container_name: geo-fake-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - geo-fake-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"

  # 可选：Streamlit前端服务
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: geo-fake-frontend
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
      - DEBUG=${DEBUG:-false}
    depends_on:
      - api
    volumes:
      - ./logs:/app/logs
    networks:
      - geo-fake-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"
