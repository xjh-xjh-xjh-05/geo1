version: '3.8'

# 网络配置
networks:
  geo-fake-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# 卷配置
volumes:
  postgres_data:
  redis_data:
  logs:
  models:

# 服务配置
services:
  # API网关
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: geo-fake-api-gateway
    ports:
      - "8000:8000"
    environment:
      - DETECTION_SERVICE_URL=http://detection-service:8000
      - USER_SERVICE_URL=http://user-service:8000
      - RULE_SERVICE_URL=http://rule-service:8000
      - DATA_SERVICE_URL=http://data-service:8000
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DEBUG=${DEBUG:-false}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9093
    depends_on:
      - detection-service
      - user-service
      - rule-service
      - data-service
    volumes:
      - logs:/app/logs
    networks:
      - geo-fake-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"

  # 检测服务
  detection-service:
    build:
      context: ./services/detection-service
      dockerfile: Dockerfile
    container_name: geo-fake-detection-service
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/geo_fake_detection
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DEBUG=${DEBUG:-false}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9093
    depends_on:
      - db
      - redis
    volumes:
      - logs:/app/logs
      - models:/app/data/models
    networks:
      - geo-fake-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "2G"

  # 用户服务
  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: geo-fake-user-service
    ports:
      - "8002:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/geo_fake_detection
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DEBUG=${DEBUG:-false}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9093
    depends_on:
      - db
      - redis
    volumes:
      - logs:/app/logs
    networks:
      - geo-fake-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"

  # 规则服务
  rule-service:
    build:
      context: ./services/rule-service
      dockerfile: Dockerfile
    container_name: geo-fake-rule-service
    ports:
      - "8003:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/geo_fake_detection
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DEBUG=${DEBUG:-false}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9093
    depends_on:
      - db
      - redis
    volumes:
      - logs:/app/logs
    networks:
      - geo-fake-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"

  # 数据服务
  data-service:
    build:
      context: ./services/data-service
      dockerfile: Dockerfile
    container_name: geo-fake-data-service
    ports:
      - "8004:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/geo_fake_detection
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DEBUG=${DEBUG:-false}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9093
    depends_on:
      - db
      - redis
    volumes:
      - logs:/app/logs
    networks:
      - geo-fake-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"

  # 数据库服务
  db:
    image: postgres:15.6-alpine
    container_name: geo-fake-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=geo_fake_detection
      - POSTGRES_INITDB_ARGS=--encoding=UTF8
      - POSTGRES_HOST_AUTH_METHOD=md5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - geo-fake-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"

  # Redis缓存服务
  redis:
    image: redis:7.2-alpine
    container_name: geo-fake-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - geo-fake-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"

  # 监控服务
  prometheus:
    image: prom/prometheus:latest
    container_name: geo-fake-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./services/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - geo-fake-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"

  # 可视化服务
  grafana:
    image: grafana/grafana:latest
    container_name: geo-fake-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - geo-fake-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"

  # Kafka消息队列
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: geo-fake-zookeeper
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
      - ZOOKEEPER_TICK_TIME=2000
    ports:
      - "2181:2181"
    networks:
      - geo-fake-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: geo-fake-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
    networks:
      - geo-fake-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"

volumes:
  grafana_data: