# Prometheus配置文件
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 告警配置
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

# 告警规则
rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

# 抓取配置
scrape_configs:
  # API网关
  - job_name: 'api-gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api-gateway:8000']

  # 检测服务
  - job_name: 'detection-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['detection-service:8000']

  # 用户服务
  - job_name: 'user-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['user-service:8000']

  # 规则服务
  - job_name: 'rule-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['rule-service:8000']

  # 数据服务
  - job_name: 'data-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['data-service:8000']

  # 数据库
  - job_name: 'postgres'
    static_configs:
      - targets: ['db:9187']

  # Redis
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:9121']